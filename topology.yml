name: bc03-sandbox

routers: []

hosts:
  - name: xubuntu-desktop
    base_box: 
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
    flavor: c6_r5_d12
    volumes:
      - size: 8
      - size: 2

networks:
  - name: network
    cidr: 10.0.0.0/24

wan:
  name: internet-connection
  cidr: 10.10.10.0/24

router_mappings: []

net_mappings:
    - router: xubuntu-desktop
      network: network
      ip: 10.0.0.1

groups: []


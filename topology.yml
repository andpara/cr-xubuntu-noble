name: bc03-test

hosts:
  - name: host
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
    flavor: standard.small

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

networks:
  - name: network
    cidr: 192.168.50.0/24

net_mappings:
  - host: host
    network: network
    ip: 192.168.50.5

router_mappings:
  - router: router
    network: network
    ip: 192.168.50.1

groups: []

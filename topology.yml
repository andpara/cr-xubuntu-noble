name: bc03-sandbox

hosts:
  - name: xubuntu-desktop
    base_box: 
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
    flavor: standard.small
    volumes:
      - size: 8
      - size: 2

routers: []

networks:
  - name: network
    cidr: 10.0.0.0/24

wan:
  name: internet-connection
  cidr: 10.10.10.0/24

net_mappings:
  - host: xubuntu-desktop
    network: network
    ip: 10.0.0.1

router_mappings: []

groups: []

